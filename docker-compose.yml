# Local development dependencies for the CDR PIM platform.
#
#   docker compose up -d                 -> PostgreSQL + pgvector only (the default)
#   docker compose --profile aws up -d   -> also LocalStack, for the SQS walking skeleton
#   docker compose --profile security up -d clamav -> local upload malware scanning
#
# The applications themselves are NOT run from Compose: `pnpm dev` gives hot reload and a
# far better debugging experience. Compose only provides the stateful dependencies.

name: cdr-pim

services:
  postgres:
    # Official pgvector image: PostgreSQL 16 with the extension precompiled, so no build
    # step and no version drift between developer machines.
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: cdr-pim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cdr
      POSTGRES_PASSWORD: cdr_local_dev
      POSTGRES_DB: cdr_pim
      # Deterministic collation, so ORDER BY behaves identically everywhere.
      LANG: C
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cdr -d cdr_pim']
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    # Only started with `--profile aws`. It exists so the SQS walking skeleton exercises
    # the REAL SqsQueueAdapter locally — the same code path that runs in AWS — instead of a
    # local-only shortcut. Skipping it just means using QUEUE_DRIVER=memory.
    image: localstack/localstack:4@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: cdr-pim-localstack
    profiles: ['aws']
    restart: unless-stopped
    environment:
      SERVICES: sqs,s3
      DEBUG: '0'
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    image: clamav/clamav:1.5.4@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    # This pinned release publishes linux/amd64; Docker Desktop uses emulation on ARM hosts.
    platform: linux/amd64
    container_name: cdr-pim-clamav
    profiles: ['security']
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 4g
    # Bootstrap existing pinned-image databases before /init starts both daemons.
    entrypoint: ['/bin/sh', '/usr/local/bin/cdr-start-clamav.sh']
    environment:
      TZ: UTC
      # Containers have their own network namespace in Compose. Only the host-loopback
      # mapping below is exposed; ECS instead configures TCPAddr=127.0.0.1 in awsvpc.
      CLAMD_CONF_TCPAddr: 0.0.0.0
      CLAMD_CONF_TCPSocket: '3310'
      CLAMD_CONF_MaxThreads: '2'
      CLAMD_CONF_StreamMaxLength: 64M
      CLAMD_CONF_MaxFileSize: 64M
      CLAMD_CONF_MaxScanSize: 256M
      CLAMD_CONF_MaxRecursion: '16'
      CLAMD_CONF_MaxFiles: '1000'
      CLAMD_CONF_MaxScanTime: '20000'
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
      CLAMD_CONF_FailIfCvdOlderThan: '7'
      FRESHCLAM_CHECKS: '12'
      CLAMAV_NO_MILTERD: 'true'
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
      - ./scripts/start-clamav.sh:/usr/local/bin/cdr-start-clamav.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - printf 'nPING\n' | nc -w 3 127.0.0.1 3310 | grep -qx PONG
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

volumes:
  postgres-data:
    name: cdr-pim-postgres-data
  clamav-data:
    name: cdr-pim-clamav-data
