# =============================================================================
# Pull-request verification
# =============================================================================
# Everything that must be true before code reaches `main`. No deployment happens here and
# no AWS credential is available to this workflow — see build-and-publish.yml.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.19.0'

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Integration tests run against a real PostgreSQL with pgvector, because the
      # behaviour they cover (upserts, cascades, partial unique indexes, cosine distance)
      # does not exist in a fake.
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: cdr
          POSTGRES_PASSWORD: cdr_ci
          POSTGRES_DB: cdr_pim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cdr -d cdr_pim_test"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree, which is the
        # only way to guarantee CI resolves exactly what the developer resolved.
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and architecture tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://cdr:cdr_ci@localhost:5432/cdr_pim_test
        run: pnpm --filter @cdr/api test:integration

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Supply-chain pin policy
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          errors = []
          action = re.compile(r'^\s*uses:\s*([^\s#]+)')
          immutable_action = re.compile(r'^[^@]+@[0-9a-f]{40}$')
          digest = re.compile(r'@sha256:[0-9a-f]{64}$')
          service_image = re.compile(r'^\s+image:\s*([^\s#]+)')

          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = action.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if not reference.startswith('./') and not immutable_action.fullmatch(reference):
                      errors.append(f'{path}:{line_number}: action is not pinned to a full SHA')

          for path in pathlib.Path('docker').glob('*.Dockerfile'):
              stages = set()
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  if line.startswith('# syntax=') and not digest.search(line):
                      errors.append(f'{path}:{line_number}: Dockerfile frontend is not pinned by digest')
                  if line.startswith('FROM '):
                      parts = line.split()
                      image = parts[1]
                      if image != 'scratch' and image not in stages and not digest.search(image):
                          errors.append(f'{path}:{line_number}: base image is not pinned by digest')
                      if len(parts) >= 4 and parts[-2].upper() == 'AS':
                          stages.add(parts[-1])

          for path in (pathlib.Path('docker-compose.yml'), pathlib.Path('.github/workflows/ci.yml')):
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = service_image.match(line)
                  if match and not digest.search(match.group(1)):
                      errors.append(f'{path}:{line_number}: service image is not pinned by digest')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('External Actions and container images are pinned immutably.')
          PY

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in dependencies
        # Fails on high/critical only. Moderate findings are reported without blocking a
        # pull request, so the gate stays credible instead of being routinely bypassed.
        run: pnpm audit --audit-level high

      - name: Secret scan
        # The gitleaks CLI rather than gitleaks-action: the action refuses to run in an
        # organization repository without a paid licence key. Same scanner, whole history.
        # Version and checksum are pinned so the binary cannot change underneath us.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build only — nothing is pushed from a pull request. This catches Dockerfile
      # breakage before it reaches main, where the publish workflow would fail instead.
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
