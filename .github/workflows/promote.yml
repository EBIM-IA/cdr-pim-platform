# =============================================================================
# Promote an already-built artefact to an environment
# =============================================================================
# BUILD ONCE — PROMOTE THE SAME ARTEFACT.
#
# This workflow never builds anything. It accepts only a full git commit SHA, resolves the
# corresponding ECR tags to immutable digests, registers new ECS task definition revisions
# pointing at those digests, and updates the services. Before any AWS credential is
# requested, PRD verifies that its GitHub Environment requires an independent reviewer.
#
# Two ways in: by hand (workflow_dispatch, QAS or PRD), or from build-and-publish.yml, which
# calls it after every main commit to keep QAS on the tip of main. A call can only reach QAS;
# PRD is always a manual, reviewed promotion.
# =============================================================================
name: Promote

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (only qas is accepted from a call)
        required: true
        type: string
      image_tag:
        description: Full git commit SHA published by build-and-publish
        required: true
        type: string
      run_migrations:
        description: Run database migrations before updating the services
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [qas, prd]
      image_tag:
        description: Full git commit SHA published by build-and-publish
        required: true
        type: string
      run_migrations:
        description: Run database migrations before updating the services
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  validate-input:
    name: Validate promotion request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
    steps:
      # This job intentionally has no id-token permission and runs before any AWS
      # credentials are available. Workflow inputs reach shell only through env values.
      - id: validate
        name: Require an immutable SHA and known environment
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::image_tag must be a full 40-character lowercase git commit SHA.'
            exit 1
          fi
          if [[ "$REQUESTED_ENVIRONMENT" != 'qas' && "$REQUESTED_ENVIRONMENT" != 'prd' ]]; then
            echo '::error::environment must be qas or prd.'
            exit 1
          fi
          # Inside a called workflow, event_name is the caller's event (push), never
          # workflow_dispatch: an automatic promotion must not reach PRD.
          if [[ "$EVENT_NAME" != 'workflow_dispatch' && "$REQUESTED_ENVIRONMENT" != 'qas' ]]; then
            echo '::error::Only QAS is promoted automatically; PRD requires a manual promotion.'
            exit 1
          fi
          printf 'environment=%s\n' "$REQUESTED_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$REQUESTED_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Require independent PRD approval policy
        if: ${{ inputs.environment == 'prd' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! environment_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/environments/prd"); then
            echo '::error::The prd GitHub Environment does not exist or cannot be inspected.'
            exit 1
          fi

          valid_rules=$(jq '[
            .protection_rules[]?
            | select(
                .type == "required_reviewers"
                and .prevent_self_review == true
                and ((.reviewers // []) | length) > 0
              )
          ] | length' <<< "$environment_json")

          if [[ ! "$valid_rules" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::PRD must require at least one reviewer and prevent self-review.'
            exit 1
          fi

  promote:
    name: Promote validated images
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.validate-input.outputs.environment }}
    # One promotion per environment at a time: two quick merges must not run migrations or
    # update the services concurrently. A newer pending promotion supersedes an older one.
    concurrency:
      group: promote-${{ needs.validate-input.outputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ needs.validate-input.outputs.image_tag }}
      TARGET_ENVIRONMENT: ${{ needs.validate-input.outputs.environment }}

    steps:
      # Promotion tooling belongs to this workflow revision, including when IMAGE_TAG
      # selects an older application for rollback. Never execute tooling from that image.
      - name: Check out promotion tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: cdr-pim-promote-${{ github.run_id }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo '::error::AWS_ACCOUNT_ID must contain exactly 12 digits.'
            exit 1
          fi
          if [[ ! "$AWS_REGION" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]; then
            echo '::error::AWS_REGION has an invalid format.'
            exit 1
          fi
          caller_account=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$caller_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::OIDC role belongs to AWS account $caller_account, expected $AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Resolve immutable digests
        id: digests
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          {
            printf '### Promoting to `%s`\n\n' "$TARGET_ENVIRONMENT"
            echo '| app | image (immutable) |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for app in api worker web; do
            digest=$(aws ecr describe-images \
              --repository-name "cdr-pim-$app" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' --output text)

            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::cdr-pim-$app:$IMAGE_TAG does not resolve to a valid ECR digest."
              exit 1
            fi

            image="$registry/cdr-pim-$app@$digest"
            printf '%s_image=%s\n' "$app" "$image" >> "$GITHUB_OUTPUT"
            printf '| `%s` | `cdr-pim-%s@%s` |\n' "$app" "$app" "$digest" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Prepare all deployment plans from active service definitions
        env:
          API_IMAGE: ${{ steps.digests.outputs.api_image }}
          WEB_IMAGE: ${{ steps.digests.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.digests.outputs.worker_image }}
        run: |
          set -euo pipefail
          umask 077
          cluster="cdr-pim-$TARGET_ENVIRONMENT"

          for app in api worker web; do
            case "$app" in
              api) image=$API_IMAGE ;;
              worker) image=$WORKER_IMAGE ;;
              web) image=$WEB_IMAGE ;;
              *) exit 1 ;;
            esac
            # A family can point at a failed, unused revision. Preserve the definition
            # actually used by this service, including its roles, ports and other secrets.
            current=$(aws ecs describe-services --cluster "$cluster" \
              --services "cdr-pim-$TARGET_ENVIRONMENT-$app" \
              --query 'services[0].taskDefinition' --output text)
            if [[ -z "$current" || "$current" == 'None' ]]; then
              echo "::error::No active task definition was found for $app."
              exit 1
            fi
            aws ecs describe-task-definition --task-definition "$current" \
              --query taskDefinition > "source-td-$app.json"
            jq --arg image "$image" --arg version "$IMAGE_TAG" '
              if any(.containerDefinitions[0].secrets[]?; .name == "APP_VERSION")
              then error("APP_VERSION must not be overridden by a secret") else . end
              | .containerDefinitions[0].image = $image
              | .containerDefinitions[0].environment = (
                  (.containerDefinitions[0].environment // [])
                  | map(select(.name != "APP_VERSION"))
                  + [{"name": "APP_VERSION", "value": $version}]
                )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            ' "source-td-$app.json" > "plan-td-$app.json"
          done

          # The operator approved reusing only the API's DATABASE_URL secret reference
          # within each environment. Never retrieve or copy its plaintext value.
          python3 scripts/configure-worker-import-runtime.py \
            plan-td-worker.json source-td-api.json configured-worker.json \
            --environment "$TARGET_ENVIRONMENT" --region "$AWS_REGION" \
            --account-id "$AWS_ACCOUNT_ID"
          mv configured-worker.json plan-td-worker.json
          python3 scripts/configure-api-file-protection.py \
            plan-td-api.json protected-api.json
          mv protected-api.json plan-td-api.json

      - name: Run database migrations
        if: ${{ inputs.run_migrations }}
        env:
          API_IMAGE: ${{ steps.digests.outputs.api_image }}
          MIGRATION_NETWORK_CONFIGURATION: ${{ vars.MIGRATION_NETWORK_CONFIGURATION }}
        run: |
          set -euo pipefail
          umask 077
          cluster="cdr-pim-$TARGET_ENVIRONMENT"
          family="cdr-pim-$TARGET_ENVIRONMENT-migrate"

          if ! jq -e 'type == "object"' <<< "$MIGRATION_NETWORK_CONFIGURATION" >/dev/null; then
            echo '::error::MIGRATION_NETWORK_CONFIGURATION must be a valid JSON object.'
            exit 1
          fi

          aws ecs describe-task-definition --task-definition "$family" \
            --query taskDefinition > td.json

          jq --arg image "$API_IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > migrate-td.json

          migrate_td=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          task_arn=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$migrate_td" \
            --launch-type FARGATE \
            --network-configuration "$MIGRATION_NETWORK_CONFIGURATION" \
            --query 'tasks[0].taskArn' --output text)

          if [[ -z "$task_arn" || "$task_arn" == 'None' ]]; then
            echo '::error::ECS did not start the migration task.'
            exit 1
          fi

          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"

          exit_code=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [[ "$exit_code" != '0' ]]; then
            echo "::error::Migration task exited with $exit_code — services were NOT updated."
            exit 1
          fi

      - name: Register the validated task definitions
        id: register
        run: |
          set -euo pipefail
          for app in worker api web; do
            new_td=$(aws ecs register-task-definition \
              --cli-input-json "file://plan-td-$app.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            if [[ -z "$new_td" || "$new_td" == 'None' ]]; then
              echo "::error::Could not register the validated $app task definition."
              exit 1
            fi
            printf '%s_task_definition=%s\n' "$app" "$new_td" >> "$GITHUB_OUTPUT"
            echo "cdr-pim-$app -> $new_td"
          done

      - name: Deploy the worker before its API producer
        env:
          WORKER_TASK_DEFINITION: ${{ steps.register.outputs.worker_task_definition }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "cdr-pim-$TARGET_ENVIRONMENT" \
            --service "cdr-pim-$TARGET_ENVIRONMENT-worker" \
            --task-definition "$WORKER_TASK_DEFINITION" >/dev/null
          aws ecs wait services-stable \
            --cluster "cdr-pim-$TARGET_ENVIRONMENT" \
            --services "cdr-pim-$TARGET_ENVIRONMENT-worker"

      - name: Verify worker revision and health
        env:
          WORKER_TASK_DEFINITION: ${{ steps.register.outputs.worker_task_definition }}
          WORKER_IMAGE: ${{ steps.digests.outputs.worker_image }}
        run: |
          set -euo pipefail
          # The new hosted worker probes PostgreSQL with verified TLS before starting
          # health or SQS. A rollback cannot pass this expected-revision/health check.
          python3 scripts/verify-ecs-promotion.py \
            --environment "$TARGET_ENVIRONMENT" --app worker \
            --task-definition "$WORKER_TASK_DEFINITION" \
            --image "$WORKER_IMAGE" --version "$IMAGE_TAG"

      - name: Deploy API and web after the verified worker
        env:
          API_TASK_DEFINITION: ${{ steps.register.outputs.api_task_definition }}
          WEB_TASK_DEFINITION: ${{ steps.register.outputs.web_task_definition }}
        run: |
          set -euo pipefail
          cluster="cdr-pim-$TARGET_ENVIRONMENT"
          for app in api web; do
            case "$app" in
              api) task_definition=$API_TASK_DEFINITION ;;
              web) task_definition=$WEB_TASK_DEFINITION ;;
            esac
            aws ecs update-service --cluster "$cluster" \
              --service "cdr-pim-$TARGET_ENVIRONMENT-$app" \
              --task-definition "$task_definition" >/dev/null
          done
          aws ecs wait services-stable --cluster "$cluster" \
            --services \
              "cdr-pim-$TARGET_ENVIRONMENT-api" \
              "cdr-pim-$TARGET_ENVIRONMENT-web"

      - name: Verify the running images and versions match the promotion
        env:
          API_IMAGE: ${{ steps.digests.outputs.api_image }}
          WEB_IMAGE: ${{ steps.digests.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.digests.outputs.worker_image }}
          API_TASK_DEFINITION: ${{ steps.register.outputs.api_task_definition }}
          WEB_TASK_DEFINITION: ${{ steps.register.outputs.web_task_definition }}
          WORKER_TASK_DEFINITION: ${{ steps.register.outputs.worker_task_definition }}
        run: |
          set -euo pipefail
          umask 077
          cluster="cdr-pim-$TARGET_ENVIRONMENT"
          for app in api worker web; do
            case "$app" in
              api) expected=$API_IMAGE; task_definition=$API_TASK_DEFINITION ;;
              worker) expected=$WORKER_IMAGE; task_definition=$WORKER_TASK_DEFINITION ;;
              web) expected=$WEB_IMAGE; task_definition=$WEB_TASK_DEFINITION ;;
              *) echo "::error::Unsupported application: $app"; exit 1 ;;
            esac
            python3 scripts/verify-ecs-promotion.py \
              --environment "$TARGET_ENVIRONMENT" --app "$app" \
              --task-definition "$task_definition" --image "$expected" --version "$IMAGE_TAG"
            if [[ "$app" == 'api' ]]; then
              aws ecs describe-task-definition --task-definition "$task_definition" \
                --query taskDefinition > running-api.json
              python3 scripts/configure-api-file-protection.py --check running-api.json
              rm running-api.json
            fi
          done

      - name: Read first file cleanup execution evidence
        id: cleanup-evidence
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 scripts/probe-file-maintenance.py \
            --environment "$TARGET_ENVIRONMENT" --version "$IMAGE_TAG"
