# =============================================================================
# Build immutable images and publish them to Amazon ECR
# =============================================================================
# Runs only after code is on `main`. This is the ONLY workflow that produces a deployable
# artefact. The digest it records is what `promote.yml` later moves between environments —
# no image is ever rebuilt for a different environment (see DEPLOYMENT_STRATEGY.md).
#
# SETUP REQUIRED before this can run — none of it was invented, so it must be provided:
#   · repository variable  AWS_ACCOUNT_ID
#   · repository variable  AWS_REGION
#   · an IAM role trusting GitHub's OIDC provider, ARN in variable AWS_DEPLOY_ROLE_ARN
#   · ECR repositories created by cdr-pim-infrastructure
# =============================================================================
name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC: no long-lived AWS access keys are stored in GitHub.
  id-token: write

jobs:
  publish:
    name: Build and push ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: meta
        name: Compute image tags
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="$REGISTRY/cdr-pim-${{ matrix.app }}"
          # The git SHA is the primary, immutable tag. A semver tag is added on releases.
          TAGS="$REPO:${{ github.sha }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,$REPO:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          # Fargate tasks run amd64. Developer machines are frequently arm64, so this is
          # stated explicitly rather than inherited from the runner.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Record the digest
        run: |
          echo "### ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.repo }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
