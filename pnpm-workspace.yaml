packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  # pnpm >=10 blocks dependency lifecycle scripts unless they are explicitly reviewed.
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver

# Security overrides. Each entry must name the advisory it closes and why upgrading the
# owning package is not possible. Remove an entry as soon as the owner ships the fix.
overrides:
  # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 (high). Every next@15.5.x pins postcss to
  # exactly 8.4.31; the fix needs >=8.5.18. Scoped to next's own copy, same major, and
  # build-time only (webpack CSS pipeline) — @tailwindcss/postcss already runs on 8.5.x.
  'next>postcss': ^8.5.18
  # Same-major floors so a lockfile refresh can never fall back to a vulnerable copy.
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p (high, dev-only via @nestjs/cli > minimatch).
  brace-expansion@<2.0.0: 1.1.21
  brace-expansion@>=4.0.0 <6.0.0: 5.0.12
  # GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g (high, dev-only via @nestjs/cli > ajv).
  fast-uri@>=3.0.0 <4.0.0: 3.1.8
  # GHSA-r3ph-w7gj-g6xm (moderate). @nestjs/swagger 11.4.x depends on js-yaml ^5.4.0.
  js-yaml@>=5.0.0 <6.0.0: 5.4.2
