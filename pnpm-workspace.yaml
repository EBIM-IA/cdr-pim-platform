packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  # pnpm >=10 blocks dependency lifecycle scripts unless they are explicitly reviewed.
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  # Security floors for vulnerable transitive ranges reported by `pnpm audit`.
  brace-expansion@<2.0.0: 1.1.21
  brace-expansion@>=4.0.0 <6.0.0: 5.0.12
  fast-uri@>=3.0.0 <4.0.0: 3.1.8
  js-yaml@>=5.0.0 <6.0.0: 5.4.2
  postcss@<8.5.23: 8.5.28
